<div class="container">

submitBtn.onclick=async()=>{
const boss=bossIn.value.trim(),direct=directIn.value.trim(),player=playerIn.value.trim(),rtype=typeIn.value,amountRaw=amountIn.value.trim(),orderNo=orderIn.value.trim();
if(!boss){showToast('填老板',true);bossIn.focus();return}
if(!player){showToast('填陪玩',true);playerIn.focus();return}
if(!amountRaw){showToast('填金额',true);amountIn.focus();return}
const amt=parseFloat(amountRaw);if(isNaN(amt)||amt<0){showToast('金额需≥0',true);amountIn.focus();return}
if(!orderNo){showToast('填单号',true);orderIn.focus();return}
if(checkDup(orderNo)){ if(!confirm('⚠️ 单号已存在，继续提交？')) {orderIn.focus();return} }
if(!fileInput.files || !fileInput.files[0]) { showToast('❌ 必须传图', true); return; }

// ================= 联动扣款逻辑开始 =================
let needDeduct = false;
let targetDeposit = null;
let newBalance = 0;

// 在预存库里找有没有同名持卡人
const matchedDeposits = deposits.filter(d => d.card_holder === boss);
if (matchedDeposits.length > 0) {
    // 取最新的一条
    targetDeposit = matchedDeposits[matchedDeposits.length - 1];
    const currentBalance = parseFloat(targetDeposit.balance) || 0;
    if (currentBalance >= amt) {
        const confirmDeduct = confirm(`💳 发现【${boss}】的预存卡，当前余额：${fmtM(currentBalance)} 元。\n\n是否从卡内扣除本单金额 ${fmtM(amt)} 元？\n\n(点“确定”扣款，点“取消”视为现金/新转账)`);
        if (confirmDeduct) {
            needDeduct = true;
            newBalance = currentBalance - amt;
        }
    } else {
        alert(`⚠️ 发现【${boss}】的预存卡，但余额不足！\n当前余额：${fmtM(currentBalance)} 元，本单需要：${fmtM(amt)} 元。\n\n将按普通结单记录，不扣减余额。`);
    }
}
// ================= 联动扣款逻辑结束 =================

const file = fileInput.files[0];
const t=fullTs();
submitBtn.disabled = true; submitBtn.textContent = '提交中...';
try {
    const fileExt = file.name.split('.').pop();
    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;
    const { error: uploadError } = await supabase.storage.from('screenshots').upload(fileName, file);
    if (uploadError) throw new Error('图传失败: ' + uploadError.message);
    const { data: urlData } = supabase.storage.from('screenshots').getPublicUrl(fileName);
    
    // 1. 提交结单记录
    const { error: dbError } = await supabase.from('reports').insert([{
        boss: boss, direct: direct || '', player: player, rtype: rtype, amount: amt, order_no: orderNo, report_time: t.full, record_date: t.date, image_url: urlData.publicUrl
    }]);
    if (dbError) throw dbError;

    // 2. 如果需要扣款，更新预存表
    if (needDeduct && targetDeposit) {
        const historyStr = `${t.full.split(' ')[0]} 结单扣款 -${fmtM(amt)} (单号:${orderNo})\n` + (targetDeposit.history || '');
        const { error: depError } = await supabase.from('deposits').update({
            balance: newBalance,
            history: historyStr
        }).eq('id', targetDeposit.id);
        
        if (depError) console.error('扣款失败:', depError);
        else showToast('✅ 结单成功，已自动扣减余额');
    } else {
        showToast('✅ 提交成功');
    }

    bossIn.value='';directIn.value='';playerIn.value='';amountIn.value='';orderIn.value='';
    fileInput.value=''; fileNameDisplay.textContent = '点击选择图片';
    fileLabel.style.borderColor = '#cbd5e1'; fileLabel.style.background = '#f8fafc';
    orderIn.classList.remove('input-warn');orderWarn.style.display='none';bossIn.focus();
    
    await fetchRecords();
    await fetchDeposits();
} catch (e) { showToast(e.message, true); } 
finally { submitBtn.disabled = false; submitBtn.textContent = '提交结单'; }
};

function buildExport(list,title){
if(!list.length)return '无记录';
const c=getCounts(list);
let txt=title+'\n'+'='.repeat(30)+'\n📊 总计：'+c.total+' 单 | 总额：'+fmtM(c.amount)+'\n🎁 礼物：'+c.g+' | 📋 主单：'+c.o+' | 🤝 好友：'+c.f+'\n'+'='.repeat(30)+'\n\n';
const groups={gift:[],other:[],friend:[]};
list.forEach(r=>{if(r.rtype==='礼物单')groups.gift.push(r);else if(r.rtype==='好友位')groups.friend.push(r);else groups.other.push(r)});
[{title:'🎁 礼物',items:groups.gift},{title:'📋 主单',items:groups.other},{title:'🤝 好友位',items:groups.friend}].forEach(sec=>{
if(!sec.items.length)return;
const sc=getCounts(sec.items);
txt+='【'+sec.title+'】共 '+sc.total+' 单 | 金额 '+fmtM(sc.amount)+'\n'+'-'.repeat(30)+'\n';
const byPlayer=new Map();
sec.items.forEach(r=>{const k=(r.player||'未知').trim()||'未知';if(!byPlayer.has(k))byPlayer.set(k,[]);byPlayer.get(k).push(r)});
byPlayer.forEach((items,name)=>{
txt+='  '+name+' ('+items.length+'单)\n';
items.sort((a,b)=>(a.report_time||'').localeCompare(b.report_time||''));
items.forEach(r=>{
